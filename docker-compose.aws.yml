services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - project_alpha_mysql_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - project_alpha_qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_FORMAT_SQL: ${SPRING_JPA_FORMAT_SQL}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION_SECONDS: ${APP_JWT_EXPIRATION_SECONDS}
      APP_REFRESH_TOKEN_EXPIRATION_SECONDS: ${APP_REFRESH_TOKEN_EXPIRATION_SECONDS}
      APP_LOGIN_RATE_LIMIT_MAX_FAILURES: ${APP_LOGIN_RATE_LIMIT_MAX_FAILURES}
      APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS}
      APP_LOGIN_RATE_LIMIT_LOCK_SECONDS: ${APP_LOGIN_RATE_LIMIT_LOCK_SECONDS}
      APP_AI_RATE_LIMIT_MAX_REQUESTS: ${APP_AI_RATE_LIMIT_MAX_REQUESTS}
      APP_AI_RATE_LIMIT_WINDOW_SECONDS: ${APP_AI_RATE_LIMIT_WINDOW_SECONDS}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS}
      APP_SECURITY_PRODUCTION_MODE: ${APP_SECURITY_PRODUCTION_MODE}
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE}
      APP_SECURITY_COOKIE_SAME_SITE: ${APP_SECURITY_COOKIE_SAME_SITE}
      APP_ADMIN_USERNAMES: ${APP_ADMIN_USERNAMES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      QDRANT_ENABLED: ${QDRANT_ENABLED}
      QDRANT_BASE_URL: ${QDRANT_BASE_URL}
      QDRANT_POST_COLLECTION: ${QDRANT_POST_COLLECTION}
      QDRANT_CHUNK_COLLECTION: ${QDRANT_CHUNK_COLLECTION}
      QDRANT_REQUEST_TIMEOUT_SECONDS: ${QDRANT_REQUEST_TIMEOUT_SECONDS}
      QDRANT_SEARCH_LIMIT: ${QDRANT_SEARCH_LIMIT}
      EMBEDDING_WORKER_ENABLED: ${EMBEDDING_WORKER_ENABLED}
      EMBEDDING_WORKER_FIXED_DELAY_MILLIS: ${EMBEDDING_WORKER_FIXED_DELAY_MILLIS}
      EMBEDDING_WORKER_BATCH_SIZE: ${EMBEDDING_WORKER_BATCH_SIZE}
      EMBEDDING_WORKER_MAX_ATTEMPTS: ${EMBEDDING_WORKER_MAX_ATTEMPTS}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/project-alpha
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  project_alpha_mysql_data:
  project_alpha_qdrant_data:
