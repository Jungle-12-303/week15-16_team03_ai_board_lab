spring:
  application:
    name: board

  datasource:
    url: jdbc:postgresql://localhost:5433/board
    username: board_user
    password: board_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
