  <rect class="section" x="1590" y="120" width="295" height="705"/>
  <text class="section-title" x="1614" y="155">External APIs</text>

  <rect class="section" x="318" y="875" width="1567" height="160"/>
  <text class="section-title" x="342" y="910">Local Infra / Development</text>

  <!-- User layer -->
