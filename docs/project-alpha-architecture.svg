  <text class="small" x="1365" y="250">chat + embeddings</text>

  <rect class="tech purple" x="1265" y="315" width="250" height="50"/>
  <text class="label" x="1390" y="346" text-anchor="middle">gpt-4.1-mini</text>

  <rect class="tech blue" x="1265" y="380" width="250" height="50"/>
  <text class="label" x="1390" y="411" text-anchor="middle">text-embedding-3-small</text>

