  <text class="small" x="1395" y="618">9 tables</text>

  <rect class="tech gray" x="1265" y="680" width="250" height="105"/>
  <text class="small" x="1390" y="708" text-anchor="middle">users, posts, comments</text>
  <text class="small" x="1390" y="732" text-anchor="middle">tags, post_tags, post_reads</text>
  <text class="small" x="1390" y="756" text-anchor="middle">embedding_jobs</text>
  <text class="small" x="1390" y="780" text-anchor="middle">post_embeddings, chunks</text>

  <!-- External APIs -->
  <rect class="card orange" x="1628" y="205" width="220" height="125" filter="url(#shadow)"/>
  <circle cx="1683" cy="252" r="28" fill="#ffd166"/>
  <path d="M1710 275 C1712 258 1699 246 1684 249 C1677 235 1653 235 1647 254 C1632 257 1628 281 1649 283 h55 c10 0 17 -3 18 -8 z" fill="#8ecae6" stroke="#219ebc" stroke-width="3"/>
  <text class="logo-text" x="1738" y="248">Weather</text>
  <text class="small" x="1738" y="273">forecast data</text>

  <rect class="card gray" x="1628" y="375" width="220" height="125" filter="url(#shadow)"/>
  <image href="logos/github.svg" x="1648" y="398" width="72" height="72" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="1738" y="418">GitHub</text>
  <text class="small" x="1738" y="443">REST API</text>

  <!-- Infra / development -->
  <rect class="card gray" x="380" y="925" width="170" height="80"/>
  <text class="logo-text" x="465" y="958" text-anchor="middle">Developer</text>
  <text class="small" x="465" y="982" text-anchor="middle">local practice</text>

  <rect class="card orange" x="610" y="925" width="170" height="80"/>
  <image href="logos/npm.svg" x="630" y="946" width="48" height="24" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="720" y="958" text-anchor="middle">npm</text>
  <text class="small" x="720" y="982" text-anchor="middle">frontend run/build</text>

  <rect class="card green" x="840" y="925" width="170" height="80"/>
  <image href="logos/gradle.svg" x="858" y="947" width="46" height="28" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="944" y="958" text-anchor="middle">Gradle</text>
  <text class="small" x="944" y="982" text-anchor="middle">backend build/run</text>

  <rect class="card blue" x="1070" y="925" width="170" height="80"/>
  <image href="logos/docker.svg" x="1118" y="940" width="78" height="52" preserveAspectRatio="xMidYMid meet"/>

  <rect class="card blue" x="1300" y="925" width="220" height="80"/>
  <text class="logo-text" x="1410" y="958" text-anchor="middle">Docker Compose</text>
  <text class="small" x="1410" y="982" text-anchor="middle">MySQL container</text>

  <rect class="card gray" x="1580" y="925" width="220" height="80"/>
  <image href="logos/github.svg" x="1607" y="937" width="56" height="56" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="1697" y="958">GitHub</text>
  <text class="small" x="1697" y="982">source control</text>

  <!-- Main arrows -->
  <path class="arrow" d="M160 356 V442"/>
  <path class="arrow" d="M246 520 H290 V238 H352"/>
  <path class="arrow" d="M625 720 H730"/>
  <path class="arrow" d="M1160 380 H1225"/>
  <path class="arrow" d="M1160 495 H1225"/>
  <path class="soft-arrow" d="M925 585 C925 520 1165 450 1265 405"/>
  <path class="soft-arrow" d="M1160 821 C1240 720 1240 345 1265 345"/>
  <path class="arrow" d="M1160 615 C1325 600 1460 265 1628 265"/>
  <path class="arrow" d="M1160 645 C1330 650 1465 435 1628 435"/>
  <path class="arrow" d="M1062 677 V792"/>
  <path class="arrow" d="M1062 780 C1080 850 1300 865 1390 680"/>

  <!-- Infra arrows -->
  <path class="arrow thin" d="M550 965 H610"/>
  <path class="arrow thin" d="M780 965 H840"/>
  <path class="arrow thin" d="M1010 965 H1070"/>
  <path class="arrow thin" d="M1240 965 H1300"/>
  <path class="dash-arrow thin" d="M1410 925 C1410 865 1390 825 1390 785"/>
  <path class="dash-arrow thin" d="M1580 965 H1520"/>

  <!-- Connection labels -->
  <rect class="pill" x="292" y="492" width="92" height="34"/>
  <text class="pill-text" x="338" y="514" text-anchor="middle">HTTP</text>

  <rect class="pill" x="653" y="690" width="98" height="34"/>
  <text class="pill-text" x="702" y="712" text-anchor="middle">REST</text>

  <rect class="pill" x="1185" y="352" width="88" height="34"/>
  <text class="pill-text" x="1229" y="374" text-anchor="middle">OpenAI</text>

  <rect class="pill" x="1185" y="468" width="82" height="34"/>
  <text class="pill-text" x="1226" y="490" text-anchor="middle">JPA</text>

  <rect x="42" y="1018" width="1840" height="32" fill="#ffffff" stroke="#d0d7de"/>
  <text class="tiny" x="960" y="1039" text-anchor="middle">
    Project Alpha: React + Spring Boot + MySQL + OpenAI RAG + MCP JSON-RPC + Agent recommendation, local deployment with Docker Compose
  </text>
</svg>
