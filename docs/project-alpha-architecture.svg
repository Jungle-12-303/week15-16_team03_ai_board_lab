<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 800 34px Arial, sans-serif; fill: #1683ff; }
      .section { fill: #ffffff; stroke: #9aa8b7; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .section-title { font: 800 18px Arial, sans-serif; fill: #2f3a45; }
      .label { font: 700 16px Arial, sans-serif; fill: #1f2933; }
      .small { font: 500 13px Arial, sans-serif; fill: #51606f; }
      .tiny { font: 500 11px Arial, sans-serif; fill: #6b7785; }
      .card { fill: #ffffff; stroke: #c7d1dc; stroke-width: 1.5; rx: 14; }
      .tech { fill: #ffffff; stroke: #d2dbe5; stroke-width: 1.4; rx: 12; }
      .green { fill: #e9f8ef; stroke: #72c98b; }
      .blue { fill: #e9f3ff; stroke: #58a6ff; }
      .purple { fill: #f2ecff; stroke: #9b72ff; }
      .orange { fill: #fff3e4; stroke: #ffb35c; }
      .red { fill: #fff0f0; stroke: #ff7b72; }
      .gray { fill: #f6f8fa; stroke: #c9d1d9; }
      .arrow { stroke: #344054; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash-arrow { stroke: #6b7785; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-gray); }
      .soft-arrow { stroke: #9aa8b7; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow-gray); }
      .thin { stroke-width: 1.8; }
      .pill { fill: #e8f5e9; stroke: #6fca86; stroke-width: 1.2; rx: 8; }
      .pill-text { font: 700 12px Arial, sans-serif; fill: #287044; }
      .logo-text { font: 800 20px Arial, sans-serif; fill: #1f2933; }
      .logo-small { font: 700 12px Arial, sans-serif; fill: #657381; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7785"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <rect x="22" y="24" width="1876" height="70" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="960" y="70" text-anchor="middle">Project Alpha Overall Architecture Diagram</text>

  <!-- Sections -->
  <rect class="section" x="34" y="120" width="255" height="705"/>
  <text class="section-title" x="58" y="155">User Layer</text>

  <rect class="section" x="318" y="120" width="345" height="705"/>
  <text class="section-title" x="342" y="155">Frontend</text>

  <rect class="section" x="695" y="120" width="500" height="735"/>
  <text class="section-title" x="719" y="155">Backend</text>

  <rect class="section" x="1225" y="120" width="330" height="325"/>
  <text class="section-title" x="1249" y="155">AI Services</text>

  <rect class="section" x="1225" y="480" width="330" height="345"/>
