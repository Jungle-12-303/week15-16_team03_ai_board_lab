  <path d="M145 250 a15 15 0 1 0 30 0 a15 15 0 1 0 -30 0" fill="none" stroke="#1683ff" stroke-width="4"/>
  <path d="M160 282 v24 M132 326 h56" stroke="#1683ff" stroke-width="5" stroke-linecap="round"/>
  <text class="logo-text" x="160" y="335" text-anchor="middle">User</text>

  <rect class="card gray" x="75" y="445" width="170" height="150" filter="url(#shadow)"/>
  <rect x="116" y="480" width="88" height="62" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="4"/>
  <rect x="116" y="480" width="88" height="18" rx="8" fill="#d0d7de"/>
  <text class="logo-text" x="160" y="590" text-anchor="middle">Browser</text>

  <!-- Frontend cards -->
  <rect class="card" x="355" y="190" width="270" height="95" filter="url(#shadow)"/>
  <image href="logos/react.svg" x="385" y="209" width="76" height="62" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="485" y="240">React</text>
  <text class="small" x="485" y="264">SPA UI, routes, forms</text>

  <rect class="card purple" x="355" y="315" width="270" height="95" filter="url(#shadow)"/>
  <image href="logos/vite.svg" x="392" y="337" width="78" height="60" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="485" y="365">Vite</text>
  <text class="small" x="485" y="389">dev server / build</text>

  <rect class="card orange" x="355" y="440" width="270" height="95" filter="url(#shadow)"/>
  <image href="logos/javascript.svg" x="390" y="464" width="70" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="485" y="490">JavaScript</text>
  <text class="small" x="485" y="514">client logic</text>

  <rect class="card blue" x="355" y="565" width="270" height="95" filter="url(#shadow)"/>
  <image href="logos/css.svg" x="392" y="585" width="72" height="66" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="485" y="615">CSS</text>
  <text class="small" x="485" y="639">board layout / modal UI</text>

  <rect class="pill" x="404" y="700" width="172" height="42"/>
  <text class="pill-text" x="490" y="725" text-anchor="middle">REST API + JWT</text>

  <!-- Backend core -->
  <rect class="card green" x="730" y="185" width="430" height="120" filter="url(#shadow)"/>
  <image href="logos/springboot.svg" x="785" y="195" width="88" height="82" preserveAspectRatio="xMidYMid meet"/>
  <text class="logo-text" x="900" y="225">Spring Boot</text>
  <text class="small" x="900" y="250">Java backend application</text>
  <text class="tiny" x="900" y="272">Spring Web / Security / Data JPA</text>
  <image href="logos/openjdk.svg" x="1085" y="205" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>

  <rect class="tech blue" x="730" y="340" width="195" height="80"/>
  <text class="label" x="827" y="372" text-anchor="middle">Spring Web</text>
  <text class="small" x="827" y="398" text-anchor="middle">REST Controller</text>

  <rect class="tech red" x="965" y="340" width="195" height="80"/>
  <image href="logos/jsonwebtokens.svg" x="985" y="356" width="36" height="36" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="1086" y="372" text-anchor="middle">Security + JWT</text>
  <text class="small" x="1086" y="398" text-anchor="middle">stateless auth</text>

  <rect class="tech green" x="730" y="455" width="195" height="80"/>
  <image href="logos/springboot.svg" x="750" y="473" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="850" y="487" text-anchor="middle">Spring Data JPA</text>
  <text class="small" x="850" y="513" text-anchor="middle">repositories</text>

  <rect class="tech orange" x="965" y="455" width="195" height="80"/>
  <image href="logos/hibernate.svg" x="985" y="472" width="38" height="38" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="1080" y="487" text-anchor="middle">Hibernate</text>
  <text class="small" x="1080" y="513" text-anchor="middle">entity mapping</text>

  <rect class="tech purple" x="730" y="585" width="195" height="92"/>
  <text class="label" x="827" y="615" text-anchor="middle">RAG</text>
  <text class="small" x="827" y="640" text-anchor="middle">similar posts search</text>
  <text class="small" x="827" y="662" text-anchor="middle">BM25 + vector + chunks</text>

  <rect class="tech blue" x="965" y="585" width="195" height="92"/>
  <text class="label" x="1062" y="615" text-anchor="middle">MCP Server</text>
  <text class="small" x="1062" y="640" text-anchor="middle">external tool caller</text>
  <text class="small" x="1062" y="662" text-anchor="middle">JSON-RPC tools/call</text>

  <rect class="tech gray" x="730" y="710" width="195" height="70"/>
  <text class="label" x="827" y="740" text-anchor="middle">Agent Logic</text>
  <text class="small" x="827" y="764" text-anchor="middle">read history recommendation</text>

  <rect class="tech gray" x="965" y="710" width="195" height="70"/>
  <text class="label" x="1062" y="740" text-anchor="middle">Embedding Worker</text>
  <text class="small" x="1062" y="764" text-anchor="middle">async vector jobs</text>

  <rect class="tech purple" x="965" y="792" width="195" height="58"/>
  <text class="label" x="1062" y="817" text-anchor="middle">AI Judgement</text>
  <text class="small" x="1062" y="840" text-anchor="middle">claim vs external data</text>

