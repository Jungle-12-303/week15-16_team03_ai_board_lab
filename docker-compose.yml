services:
  mysql:
    image: mysql:8.4
    container_name: project-alpha-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-alpha}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alpha_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - project_alpha_mysql_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: project-alpha-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - project_alpha_qdrant_data:/qdrant/storage

volumes:
  project_alpha_mysql_data:
  project_alpha_qdrant_data:
