services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: board-postgres
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board_user
      POSTGRES_PASSWORD: board_pass
    ports:
      - "5433:5432"
    volumes:
      - board-postgres-data:/var/lib/postgresql/data

volumes:
  board-postgres-data:
