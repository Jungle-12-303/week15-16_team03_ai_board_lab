name: ai-knowledge-board

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-board-db
    environment:
      POSTGRES_DB: ai_board
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-ai_board}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-ai_board}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-ai_board} -d ai_board"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ai-board-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ai_board
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ai_board}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-ai_board}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}
      NOTION_VERSION: ${NOTION_VERSION:-2026-03-11}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: ai-board-frontend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-board-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
