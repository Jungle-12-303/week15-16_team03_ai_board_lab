spring.application.name=namanmu
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/project_alpha?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alpha}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alpha_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${APP_JWT_SECRET:project-alpha-local-development-secret-change-me}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:30}

app.embedding-worker.enabled=${EMBEDDING_WORKER_ENABLED:true}
app.embedding-worker.fixed-delay-millis=${EMBEDDING_WORKER_FIXED_DELAY_MILLIS:30000}
app.embedding-worker.batch-size=${EMBEDDING_WORKER_BATCH_SIZE:5}

app.corpus-import.enabled=${CORPUS_IMPORT_ENABLED:false}
app.corpus-import.source-file=${CORPUS_IMPORT_SOURCE_FILE:src/main/resources/corpus-sources.tsv}
app.corpus-import.author-name=${CORPUS_IMPORT_AUTHOR_NAME:crawler}
app.corpus-import.max-items=${CORPUS_IMPORT_MAX_ITEMS:20}
app.corpus-import.min-content-length=${CORPUS_IMPORT_MIN_CONTENT_LENGTH:500}
app.corpus-import.max-content-length=${CORPUS_IMPORT_MAX_CONTENT_LENGTH:12000}
app.corpus-import.request-timeout-seconds=${CORPUS_IMPORT_REQUEST_TIMEOUT_SECONDS:10}
app.corpus-import.request-delay-millis=${CORPUS_IMPORT_REQUEST_DELAY_MILLIS:1000}
app.corpus-import.exit-after-run=${CORPUS_IMPORT_EXIT_AFTER_RUN:true}
app.corpus-import.user-agent=${CORPUS_IMPORT_USER_AGENT:ProjectAlphaCorpusImporter/1.0}
