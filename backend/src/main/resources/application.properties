spring.application.name=namanmu
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/project_alpha?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alpha}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alpha_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

app.jwt.secret=${APP_JWT_SECRET:project-alpha-local-development-secret-change-me}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}
app.refresh-token.expiration-seconds=${APP_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

app.security.cors-allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.cookie-same-site=${APP_SECURITY_COOKIE_SAME_SITE:Lax}
app.security.production-mode=${APP_SECURITY_PRODUCTION_MODE:false}

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
app.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.openai.request-timeout-seconds=${OPENAI_REQUEST_TIMEOUT_SECONDS:30}

app.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
app.github.token=${GITHUB_TOKEN:}

app.embedding-worker.enabled=${EMBEDDING_WORKER_ENABLED:true}
app.embedding-worker.fixed-delay-millis=${EMBEDDING_WORKER_FIXED_DELAY_MILLIS:30000}
app.embedding-worker.batch-size=${EMBEDDING_WORKER_BATCH_SIZE:5}

app.qdrant.enabled=${QDRANT_ENABLED:true}
app.qdrant.base-url=${QDRANT_BASE_URL:http://localhost:6333}
app.qdrant.post-collection=${QDRANT_POST_COLLECTION:project_alpha_posts}
app.qdrant.chunk-collection=${QDRANT_CHUNK_COLLECTION:project_alpha_chunks}
app.qdrant.request-timeout-seconds=${QDRANT_REQUEST_TIMEOUT_SECONDS:5}
app.qdrant.search-limit=${QDRANT_SEARCH_LIMIT:500}

app.rag-search.max-limit=${RAG_SEARCH_MAX_LIMIT:10}
app.rag-search.min-vector-relevance-score=${RAG_SEARCH_MIN_VECTOR_RELEVANCE_SCORE:0.45}
app.rag-search.min-hybrid-relevance-score=${RAG_SEARCH_MIN_HYBRID_RELEVANCE_SCORE:0.38}
app.rag-search.min-ranked-result-score=${RAG_SEARCH_MIN_RANKED_RESULT_SCORE:0.60}
app.rag-search.bm25-k1=${RAG_SEARCH_BM25_K1:2.0}
app.rag-search.bm25-b=${RAG_SEARCH_BM25_B:0.25}
app.rag-search.vector-weight-with-query-terms=${RAG_SEARCH_VECTOR_WEIGHT_WITH_QUERY_TERMS:0.35}
app.rag-search.bm25-weight-with-query-terms=${RAG_SEARCH_BM25_WEIGHT_WITH_QUERY_TERMS:0.65}
app.rag-search.keyword-alignment-weight=${RAG_SEARCH_KEYWORD_ALIGNMENT_WEIGHT:0.25}
app.rag-search.chunk-evidence-weight=${RAG_SEARCH_CHUNK_EVIDENCE_WEIGHT:0.03}
app.rag-search.rrf-rank-constant=${RAG_SEARCH_RRF_RANK_CONSTANT:60.0}
app.rag-search.max-query-terms=${RAG_SEARCH_MAX_QUERY_TERMS:12}
app.rag-search.max-guard-terms=${RAG_SEARCH_MAX_GUARD_TERMS:6}
app.rag-search.query-mode=${RAG_SEARCH_QUERY_MODE:TITLE_CONTENT}
app.rag-search.fusion-mode=${RAG_SEARCH_FUSION_MODE:RRF}
app.rag-search.metadata-enabled=${RAG_SEARCH_METADATA_ENABLED:true}

app.corpus-import.enabled=${CORPUS_IMPORT_ENABLED:false}
app.corpus-import.source-file=${CORPUS_IMPORT_SOURCE_FILE:src/main/resources/corpus-sources.tsv}
app.corpus-import.author-name=${CORPUS_IMPORT_AUTHOR_NAME:crawler}
app.corpus-import.max-items=${CORPUS_IMPORT_MAX_ITEMS:20}
app.corpus-import.min-content-length=${CORPUS_IMPORT_MIN_CONTENT_LENGTH:500}
app.corpus-import.max-content-length=${CORPUS_IMPORT_MAX_CONTENT_LENGTH:12000}
app.corpus-import.request-timeout-seconds=${CORPUS_IMPORT_REQUEST_TIMEOUT_SECONDS:10}
app.corpus-import.request-delay-millis=${CORPUS_IMPORT_REQUEST_DELAY_MILLIS:1000}
app.corpus-import.exit-after-run=${CORPUS_IMPORT_EXIT_AFTER_RUN:true}
app.corpus-import.user-agent=${CORPUS_IMPORT_USER_AGENT:ProjectAlphaCorpusImporter/1.0}
