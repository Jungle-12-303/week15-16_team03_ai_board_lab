spring.application.name=ai-knowledge-board

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hoseok}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ai_board}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ai_board}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:1536}

openai.api-key=${OPENAI_API_KEY:}
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=${AI_EMBEDDING_DIMENSIONS:1536}

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.dimensions=${AI_EMBEDDING_DIMENSIONS:1536}
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

github.token=${GITHUB_TOKEN:}

notion.api-key=${NOTION_API_KEY:}
notion.data-source-id=${NOTION_DATA_SOURCE_ID:}
notion.version=${NOTION_VERSION:2026-03-11}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
