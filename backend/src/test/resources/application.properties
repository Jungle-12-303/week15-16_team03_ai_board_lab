spring.datasource.url=jdbc:h2:mem:project_alpha_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.jwt.secret=project-alpha-test-secret-at-least-32-bytes
app.jwt.expiration-seconds=900
app.refresh-token.expiration-seconds=604800
app.login-rate-limit.max-failures=5
app.login-rate-limit.window-seconds=600
app.login-rate-limit.lock-seconds=300
app.ai-rate-limit.max-requests=20
app.ai-rate-limit.window-seconds=60
app.security.cors-allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.security.cookie-secure=false
app.security.cookie-same-site=Lax
app.security.production-mode=false
app.admin.usernames=
app.embedding-worker.max-attempts=3
